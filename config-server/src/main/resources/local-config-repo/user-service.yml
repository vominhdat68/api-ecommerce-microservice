server:
  port: 8082


spring:
  datasource:
    url: jdbc:mysql://localhost:3306/auth_service?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: ""
    # Không làm dừng ứng dụng khi không thể kết nối DB
    continue-on-error: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/