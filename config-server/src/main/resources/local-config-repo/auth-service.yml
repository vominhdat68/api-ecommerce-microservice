server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/auth_service?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: ""
    # Không làm dừng ứng dụng khi không thể kết nối DB
    continue-on-error: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}" #callback URI trong code "phải" khớp với URI đã đăng ký trong Google Cloud Console
            scope:
              - openid
              - profile
              - email
            client-name: Google
            authorization-grant-type: authorization_code
        #          facebook:
        #            client-id: YOUR_FACEBOOK_CLIENT_ID
        #            client-secret: YOUR_FACEBOOK_CLIENT_SECRET
        #            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        #            scope:
        #              - email
        #              - public_profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: name
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
  #          facebook:
  #            authorization-uri: https://www.facebook.com/v10.0/dialog/oauth
  #            token-uri: https://graph.facebook.com/v10.0/oauth/access_token
  #            user-info-uri: https://graph.facebook.com/me?fields=id,name,email
  #            user-name-attribute: id

  # email
  mail:
    host: smtp.gmail.com  # SMTP server c?a nhà cung c?p email
    port: 587                           # C?ng k?t n?i SMTP (th??ng dùng 587 ho?c 465)
    username: sgfdainesend@gmail.com     # Email dùng ?? g?i
    password: kunm pvfy jpkn einr       # M?t kh?u email (ho?c app password n?u dùng 2FA)
    properties:
      mail:
        smtp:
          auth: true                    # Yêu c?u xác th?c khi g?i email
          starttls:
            enable: true         # Kích ho?t mã hóa TLS (b?o m?t)
          ssl:
            trust: smtp.gmail.com  # Tin t??ng SSL certificate c?a host
    test-connection: true               # Ki?m tra k?t n?i khi kh?i ??ng ?ng d?ng

  app:
    email:
      sender-address: sgfdainesend@gmail.com  # Email hi?n th? ng??i g?i
      sender-name: Your App Name               # Tên hi?n th? thay cho email
      otp:
        expiration-minutes: 5                  # Th?i gian h?t h?n OTP (phút)
        subject: Your OTP Code                 # Tiêu ?? email OTP

  # Redis
  cache:
    type: redis
  redis:
    host: localhost
    port: 6379


# Cấu hình bảo mật thêm
security:
  oauth2:
    client:
      prefer-static-issuer: true
  require-ssl: false # Bật true nếu dùng HTTPS

